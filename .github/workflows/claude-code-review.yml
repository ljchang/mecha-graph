name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    # Two exclusions, both for the same reason: a red X that means "no
    # credential" is worse than no check at all.
    #
    # A pull request from a fork gets no access to repository secrets, so the
    # action cannot authenticate and would fail on every external contribution.
    #
    # A Dependabot pull request reads Dependabot's own secret store rather than
    # the repository's, so it cannot authenticate either — and an LLM review of
    # a version bump is not worth the tokens even when it can.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # **A review that cannot authenticate must say so, not pass.**
      # On 2026-09-01 this job reported success on PR #1 and posted zero
      # comments: `CLAUDE_CODE_OAUTH_TOKEN` was never set on this repo, and
      # a green tick that means "nothing was reviewed" is exactly the
      # failure the denylist job beside it is written to avoid. It was then
      # merged partly on the strength of that tick. The next PR failed
      # loudly for the same missing secret, which is the behaviour both
      # should have had.
      - name: Refuse to review without a credential
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
            echo "Generate one with \`claude setup-token\` and add it as a repository"
            echo "secret. Until then this job fails rather than reporting a review"
            echo "that did not happen."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # A subscription credential, not a metered API key: Pro/Max plans
          # authenticate the action through OAuth, so a review costs plan
          # usage rather than API credits. Generate with `claude setup-token`
          # and store as CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            Read CLAUDE.md and docs/ARCHITECTURE.md before judging the diff —
            this codebase records why each decision was made beside the code
            that implements it, and most real defects here undo one of those
            rather than being ordinary bugs.

            Weight your attention in this order:

            1. **The public denylist.** This repository is public and holds a
               personal knowledge graph's code. A real name, address, place or
               identifier in a comment, fixture, test or doc is the most
               expensive defect this repo can ship, and it cannot be taken
               back once pushed. The roster itself is deliberately not in the
               repository — do NOT try to reconstruct it or guess its contents,
               and never quote a suspected term in your review. Flag the FILE
               and say that a human must check it. `.github/workflows/
               denylist.yml` runs the real gate; if it is red, say so plainly
               and treat everything else as secondary.

            2. **Migrations are append-only and numbered.** A new migration
               must take the next free version — a duplicate silently SKIPS
               the real migration of that number, which on 2026-09-01 meant
               `reviewed_by` was never created and nine unrelated tests failed
               with "no such column". Check the number is unique and that the
               array is appended to, not inserted into.

            3. **A new table must join `db.rs`'s `COPY_TABLES`,** or `decrypt`,
               `encrypt_in_place` and `fork_db` silently drop it from every
               snapshot. And the copy must tolerate a source that predates the
               migration: `src` is attached as-is and never migrated, so an
               unconditional INSERT breaks every archived `.bak`.

            4. **Guards fail closed, and unknown is never clean.** A check that
               cannot run must stop the run rather than pass. A rate over an
               empty denominator is `None`, not zero; an unreadable store is a
               finding, not an empty queue. Look for a `dry_run` path that
               writes — on 2026-09-01 an alarm's bookkeeping ignored `dry_run`,
               so the preview CONSUMED the finding and the real run reported
               nothing.

            5. **An outcome that leaves no record cannot be aged.** A retry
               driven by a store only successes write to repeats forever. Look
               for `Err(_)` that discards a reason, and for cooldowns or
               backoffs keyed on output rather than on the attempt.

            6. **A closed enum in an append-only store is a wire format.**
               Unknown variants must degrade to a default on load rather than
               failing the record.

            Report findings as `file:line — summary` with a concrete failure
            scenario: specific inputs or state leading to a wrong outcome.
            Rank most severe first, and label each MAJOR / MEDIUM / MINOR —
            the owner's rule is that major and medium get fixed before merge
            and the rest are theirs to weigh. If nothing survives scrutiny,
            say so plainly rather than inventing findings: a review that
            always finds something teaches maintainers to ignore it.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific code issues.
            Only post GitHub comments — do not return review text as a
            message. **A review that is not posted did not happen**: the
            first real run on this repo spent 39 turns and $0.84 producing
            one, then took 14 permission denials trying to post it, because
            neither the instruction nor the tool grant below existed. The
            job reported success.

          # Pinned rather than left to the action's default, which is
          # `claude-sonnet-5` — verified in this repo's own run-log init
          # event before pinning.
          claude_args: |
            --model claude-opus-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cargo check:*),Bash(cargo clippy:*),Bash(cargo test:*)"
