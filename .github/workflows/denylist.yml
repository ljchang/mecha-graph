name: Public denylist

# The gate that used to run at export time.
#
# Until 2026-09-01 this repository was a published artifact: work happened in
# a private checkout and `scripts/export-public.sh` ran the roster over the
# tree before anything left. Working here directly removes the export, and
# with it the only place the roster was ever checked — so the gate has to run
# on the repository itself or it does not run at all.
#
# **The roster is not in this repository, and must never be.** It is a list of
# the names and places that must not appear here, which makes the list itself
# the most sensitive file in the set. It lives in the `PUBLIC_DENYLIST` secret
# and is written to a temp file for the length of one job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  denylist:
    name: denylist
    runs-on: ubuntu-latest
    steps:
      # Full history: every commit a push or pull request carries is public by
      # SHA once it lands, so each one is checked, not only the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tree against the roster
        env:
          ROSTER: ${{ secrets.PUBLIC_DENYLIST }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The branch's own name is published too (the branch list, the PR URL).
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -uo pipefail

          # **Fail closed.** A gate that cannot run must stop the run rather
          # than pass — the same rule the sandbox preflight and the pre_tool
          # hooks follow. Two ways to get here and both are failures, not
          # skips: the secret is unset, or this is a fork PR, which gets no
          # access to repository secrets at all. A green check that means
          # "nothing was checked" is worse than no check.
          if [ -z "${ROSTER:-}" ]; then
            echo "::error::PUBLIC_DENYLIST is empty or unavailable — the gate cannot run."
            echo "On a fork PR this is expected: secrets are withheld, so this check"
            echo "cannot pass and the pull request needs an owner-run gate before merge."
            exit 1
          fi

          # The most sensitive file in the set, for the length of one step:
          # private to this user, at a path nobody else chose, and removed on
          # every exit, the early ones included.
          umask 077
          roster=$(mktemp)
          trap 'rm -f "$roster"' EXIT
          printf '%s\n' "$ROSTER" > "$roster"
          # The commits this run brings in: a pull request's base..head, a
          # push's before..after. A leak added in one commit and removed in a
          # later one is still public by SHA, and so is a commit message — the
          # checked-out tree shows neither. **An unknown base stops the run**
          # rather than narrowing to the tip: a force-push to main leaves
          # `before` unreachable, and "checked the tip, called it clean" is the
          # silent skip this gate exists to refuse. Check such a push with the
          # hook locally, which knows what it pushed.
          if [[ "${BASE_SHA:-}" == *[!0]* ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range=("$BASE_SHA..$HEAD_SHA")
          else
            echo "::error::cannot tell which commits this run brings in (base '${BASE_SHA:-none}' unknown — a force-push or a new ref); refusing to check only the tip"
            exit 1
          fi
          commits=()
          list=$(git rev-list "${range[@]}") || { echo "::error::could not list the commits under check"; exit 1; }
          [ -n "$list" ] && while read -r c; do commits+=("$c"); done <<<"$list"
          echo "checking the tree and ${#commits[@]} commit(s)"

          # Names and messages are published too: file and directory names (in
          # the tree listing, the PR file list, `git log --stat`), and commit
          # messages. Each written once to its own file; each term is then one
          # grep over them all. Author fields are the owner's own and public.
          texts=$(mktemp -d)
          trap 'rm -f "$roster"; rm -rf "$texts"' EXIT
          git ls-files >"$texts/paths-tree"
          printf '%s\n' "${HEAD_REF:-}" >"$texts/names-branch"
          # Each commit is checked for what it ADDS — the lines, the paths — and
          # its message, not its whole tree: every commit's tree carries what it
          # inherited, so a whole-tree check of each would re-flag an old leak in
          # every commit of the change that removes it, which could then never
          # pass. The checked-out tree above is the whole final state. Against
          # the first parent for a merge; the merged commits are checked as
          # themselves.
          for c in "${commits[@]}"; do
            # `:!LICENSE` as in the tree scan: a year bump must not be a hit.
            git diff-tree -p -r --no-commit-id --no-color -U0 --root -m --first-parent "$c" -- . ':!LICENSE' \
              | { grep '^+' || true; } | { grep -v '^+++ ' || true; } | cut -c2- >"$texts/additions-commit-${c:0:12}"
            git diff-tree -r --no-commit-id --name-only --diff-filter=AR --root -m --first-parent "$c" -- . ':!LICENSE' \
              >"$texts/paths-commit-${c:0:12}"
            git log -1 --format=%B "$c" >"$texts/message-commit-${c:0:12}"
          done

          # grep is line-oriented, so a `p` term of several words is the one kind
          # wrapped text can split — and prose here is hard-wrapped at ~75
          # columns in docs, comments and commit messages alike. Each line is
          # joined to the next (indentation and a leading comment marker
          # stripped, whitespace collapsed); multiword terms are looked for
          # across the join. Path and ref-name lists are not joined: they are
          # one entry per line, and joining two would only invent a match.
          joined=$(mktemp)
          trap 'rm -f "$roster" "$joined"; rm -rf "$texts"' EXIT
          join_lines() {
            awk -v OFS='\t' 'FNR == 1 { prev = "" }
              { l = $0
                sub(/^[ \t]*(\/\/+!?|#+|\*+|--|;+|>+)?[ \t]*/, "", l)
                gsub(/[ \t\r]+/, " ", l); sub(/ $/, "", l)
                if (prev != "" && l != "") print FILENAME, prev " " l
                prev = l }' "$@"
          }
          # `-z`: paths verbatim. Without it `git ls-files` C-quotes a path
          # holding a non-ASCII byte, `[ -f ]` fails on the quoted form, and
          # the file would be skipped here while the step still said clean.
          # A join that fails stops the run: a short joined text is a check
          # that did not happen, not a clean one.
          while IFS= read -r -d '' f; do
            [ "$f" = LICENSE ] && continue
            [ -f "$f" ] && grep -Iq . "$f" 2>/dev/null || continue
            join_lines "$f" >>"$joined" || { echo "::error::could not join the lines of a tracked file"; exit 1; }
          done < <(git ls-files -z)
          for f in "$texts"/additions-* "$texts"/message-*; do
            [ -f "$f" ] || continue
            join_lines "$f" >>"$joined" || { echo "::error::could not join the lines of a commit's text"; exit 1; }
          done

          # A `w` term is literal text bounded by anything that is not a letter or
          # digit — grep's own `-w` counts `_` as a word character, so a short
          # name inside `name_email` could never match. Escaped into an ERE for
          # that alone; a `p` term stays a fixed substring. (camelCase stays out
          # of reach: case ignored, joined words cannot be told apart.)
          ere_escape() {
            local s=$1 out= c i
            for ((i = 0; i < ${#s}; i++)); do
              c=${s:i:1}
              case "$c" in
                '\'|'.'|'*'|'^'|'$'|'+'|'?'|'('|')'|'['|']'|'{'|'}'|'|') out+="\\$c" ;;
                *) out+=$c ;;
              esac
            done
            printf '%s' "$out"
          }

          fail=0
          n=0
          line_no=0
          # `|| [ -n "$line" ]`: a last line with no newline is still a line.
          while IFS= read -r line || [ -n "$line" ]; do
            line_no=$((line_no+1))
            # CRLF would leave a `\r` on every term, and a term that cannot
            # match is a term that was never checked.
            line=${line%$'\r'}
            # Blank lines and `#` comments so the roster can carry its own
            # notes about why a term is on it.
            case "$line" in ''|'#'*) continue ;; esac
            kind=${line%% *}
            term=${line#"$kind"}
            term="${term#"${term%%[![:space:]]*}"}"
            term="${term%"${term##*[![:space:]]}"}"
            if [ -z "$term" ]; then
              echo "::error::roster line $line_no has a kind but no term"
              exit 1
            fi
            # Two kinds, and the distinction is load-bearing. A `w` term is
            # short enough to live inside an ordinary English word, so it
            # matches at word boundaries; a `p` term is multiword or
            # address-shaped and matches as a substring. A first draft
            # flattened them and refused a clean tree over two common words
            # that happened to contain a roster term.
            #
            # Both kinds are fixed strings (`-F`): a term holding `[` or `(`
            # would otherwise be a broken regex, and grep's error exit must
            # not read as "no match".
            case "$kind" in
              w) flags="-rIliE"; tflags="-liE"
                 pat="(^|[^[:alnum:]])$(ere_escape "$term")(\$|[^[:alnum:]])" ;;
              p) flags="-rIliF"; tflags="-liF"; pat=$term ;;
              *) echo "::error::roster line $line_no: unknown kind"; exit 1 ;;
            esac
            n=$((n+1))
            # **Never print the term — or a path.** GitHub masks a secret's
            # whole value in logs, not its individual lines, so echoing a
            # matched term would publish the roster one finding at a time, in
            # a public repository's build log. A matching file's path can
            # carry the term too (a file named after the person it names), so
            # only counts, commit ids and a stable roster line index are
            # printed; the local hook names term and files.
            #
            # LICENSE carries the copyright holder's name by definition. Nothing
            # else is excluded — not `.githooks`, not this file: a gate this
            # check cannot see is where a name slips out, and neither holds a
            # term. (`target/` is build output, never committed.)
            # `.git` as a file too: in a worktree it is a pointer holding
            # this machine's path, which is not repository content.
            # `|| rc=$?`, not a bare assignment then `$?`: Actions runs this
            # step as `bash -e`, and a grep that finds nothing (exit 1, the
            # normal case) would otherwise end the step on the first term.
            rc=0
            hits=$(grep $flags --exclude-dir=.git --exclude=.git --exclude-dir=target \
                     --exclude=LICENSE -e "$pat" . 2>/dev/null) || rc=$?
            case "$rc" in
              0) echo "::error::DENYLIST HIT (roster line $line_no) in $(printf '%s\n' "$hits" | wc -l) file(s) of the tree"
                 fail=1 ;;
              1) ;;
              # An error is not a clean result. Never print the term here
              # either — only that the line could not be checked.
              *) echo "::error::grep failed (exit $rc) on roster line $line_no — refusing to call that clean"
                 exit 1 ;;
            esac
            # Each commit's additions and added paths, file and directory names
            # in the tree, the branch name, and commit messages.
            rc=0
            hits=$(grep $tflags -e "$pat" "$texts"/* 2>/dev/null) || rc=$?
            case "$rc" in
              0) for f in $hits; do
                   f=${f##*/}
                   echo "::error::DENYLIST HIT (roster line $line_no) in the ${f%%-*} of ${f#*-}"
                 done
                 fail=1 ;;
              1) ;;
              *) echo "::error::grep failed (exit $rc) on names or messages, roster line $line_no"; exit 1 ;;
            esac
            # A multiword term across a line break — a count only, never where.
            if [ "$kind" = p ] && [[ "$term" == *[[:space:]]* ]]; then
              norm=$(printf '%s' "$term" | tr -s '[:space:]' ' ')
              rc=0
              # Distinct sources, not matching pairs: each inner line sits in two
              # pairs, so a pair count would report one place twice.
              k=$(grep -iF -e "$norm" "$joined" 2>/dev/null | cut -f1 | sort -u | wc -l) || rc=$?
              [ "$rc" -eq 0 ] && [ "$k" -eq 0 ] && rc=1
              case "$rc" in
                0) echo "::error::DENYLIST HIT (roster line $line_no) across a line break, in $k file(s) or commit(s)"
                   fail=1 ;;
                1) ;;
                *) echo "::error::grep failed (exit $rc) across line breaks, roster line $line_no"; exit 1 ;;
              esac
            fi
          done < "$roster"

          if [ "$n" -eq 0 ]; then
            echo "::error::the roster parsed to zero terms — refusing to call that clean"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "To see which term hit, run .githooks/pre-push locally with the roster in place"
            echo "(owner-only: the roster is deliberately not in this repository or this log)."
            exit 1
          fi
          echo "clean: $n roster term(s), no hits"
